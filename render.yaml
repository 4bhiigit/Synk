services:
  # Daphne ASGI Web Service
  - type: web
    name: nexus-chat-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "daphne -b 0.0.0.0 -p $PORT core.asgi:application"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-chat-db
          property: connectionString

databases:
  # Free PostgreSQL Database on Render
  - name: nexus-chat-db
    region: oregon
    plan: free
    databaseName: nexus_chat_db
    user: nexus_user
